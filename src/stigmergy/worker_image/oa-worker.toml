# stigmergy-worker — the in-cage `openalph exec` worker agent (bead .149 §5).
#
# Provisioned to /etc/openalph/agents/stigmergy-worker.toml ONLY on rigs that
# declare `[provision] oa_wheelhouse = true` (openalph is pip-installed from
# the rig's host-built wheelhouse). The `openalph exec` driver launches
# `openalph exec --agent stigmergy-worker ...` inside the hardened cage.
#
#   workspace = "/scratch"   -> the OA agent's WORKSPACE: SessionLog /
#   flight-recorder JSONLs (full transcripts + the capability token) root
#   under it, on the tmpfs that dies with the cage — they can NEVER land in
#   the mounted git clone (spec .149 §2 decision 1). The PROCESS cwd is
#   /work (the clone) — set by the driver's --workdir — so OA's file tools
#   resolve relative paths into the tree.
#
#   default_model is OVERRIDDEN per-dispatch by the driver's --model
#   (worker_model, derived from the rig's models.toml entry:
#   f"{oa_provider_key}/{version}"); it is a load-time fallback only.
#
# Both providers point at the IN-CAGE loopback relay shim (shim.py
# RELAY_PORT 18081 -> /run/relay.sock -> host CredentialRelay). The worker
# authenticates with OPENAI_API_KEY = the per-dispatch capability token
# (injected by the driver; the relay authorizes the capability on every
# lane, and a local lane omits the upstream auth header — .147 F1). `api_key`
# is resolved via the `_env` suffix (openalph config `_resolve_secret`),
# never inlined here — a real key must never be baked into an image.

[agent]
name = "stigmergy-worker"
default_model = "blackwell/qwen38-27b-fp8"
# Per-COMPLETION output cap (every single model response). 8192 was too
# small: a worker emitting one large file-write tool call truncated at
# 8192 (stop_reason=length), the truncated turn was misreported as a
# clean finish, and the worker exited having committed nothing — empty
# bundles, integration-conflict loop, escalation (caught live on
# quotagov01 2026-08-31, bead .159). SIZING TRADEOFF (measured live,
# same day): this reserve is SUBTRACTED from context runway by the OA
# capacity guard (available = window - max_tokens), so an oversized
# output cap converts a recoverable session into a fatal overflow —
# a 65536 reserve let a single ~117k tool-result turn push park-wiring
# past qwen38's window by 686 tokens. 32768 = 1.8x the largest observed
# legitimate completion (18,156 qwen38; 4,630 GLM-5.3) while giving back
# 32k of runway. The real fix for result spikes is harness-side output
# bounding, not an ever-larger reserve.
max_tokens = 32768
thinking = "off"

# OA's config schema: the workspace is a TABLE with a `path` key
# (config.py load path: `[workspace]` section, or inline
# `[agent.workspace]` with `path`) — a bare `workspace = "..."` string on
# [agent] is a load error ("Missing required field: workspace.path").
[workspace]
path = "/scratch"

[providers.blackwell]
type = "openai"
base_url = "http://127.0.0.1:18081"
api_key_env = "OPENAI_API_KEY"
# SB ruling 2026-08-31: reasoning_replay ON for ALL stations on all rigs.
# Qwen's model card: "preserve_thinking is enabled by default for all
# workloads" — strip-mode tool loops are outside the vendor envelope and
# the degeneration signature (mega-completions, re-derivation burn,
# whole-file-rewrite spikes on long loops) was observed live on
# quotagov01 (bead .159/.161 lineage). Replay makes reasoning cumulative
# context — that is the vendor-default trade; context management is the
# GC's job (kdsn.305), deployed when it is actually a problem.
quirks = ["reasoning_replay"]

[providers.synthetic]
type = "openai"
base_url = "http://127.0.0.1:18081"
api_key_env = "OPENAI_API_KEY"
# Same ruling. REQUIRED for Kimi-K3 (passback requirement, kdsn.241
# lineage) and matches the fleet's host-side synthetic entry.
quirks = ["reasoning_replay"]
